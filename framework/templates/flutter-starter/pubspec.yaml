# {{PROJECT_NAME}} — Flutter app manifest.
# Scaffolded from framework/templates/flutter-starter/; see README.md.
#
# SDK pin: Flutter 3.47 is the intended pin (provisional — not yet released at
# the time this starter landed). The constraints below are deliberately loose so
# the scaffold boots on the toolchain the project actually has; tighten
# `flutter:` to '>=3.47.0' once the pin is confirmed. See config-rules.md
# §Frontend Framework.
#
# `name:` must be a valid Dart package identifier (lowercase, underscores) —
# that is what {{PROJECT_NAME_SLUG}} resolves to at scaffold-fill time.
name: "{{PROJECT_NAME_SLUG}}"
description: "{{DESCRIPTION}}"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Bundled fonts: Flutter has no CSS font stack, so {{PRIMARY_FONT}} must be
  # declared here (family name = the value you substitute into
  # lib/theme/tokens.dart → AppTokens.fontFamily) per
  # design-system/tokens/typography.md. Example:
  #
  # fonts:
  #   - family: {{PRIMARY_FONT}}
  #     fonts:
  #       - asset: assets/fonts/{{PRIMARY_FONT}}-Regular.ttf
  #       - asset: assets/fonts/{{PRIMARY_FONT}}-Bold.ttf
  #         weight: 700
