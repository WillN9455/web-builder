# Analysis rules for {{PROJECT_NAME}}.
# `flutter_lints` is the baseline; the rules below are the ones the Build stage
# needs enforced (see ../../build/skills/coding-guidelines.md §Code Review
# Checklist and ../../build/skills/code-quality.md). Treat analyzer output as
# blocking: `flutter analyze` runs before any task is called complete.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Placeholder tokens and TODOs must not survive to a shipped build.
    todo: ignore

linter:
  rules:
    # No hardcoded UI values outside lib/theme/ — the analyzer cannot check
    # this, so the reviewer does (see README.md §Token wiring).
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    always_declare_return_types: true
    avoid_print: true
    unnecessary_lambdas: true
    sort_child_properties_last: true
    use_key_in_widget_constructors: true
